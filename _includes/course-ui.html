<div class="course-progress" aria-hidden="true"><span></span></div>
<script>
  (() => {
    const progress = document.querySelector('.course-progress span');
    if (!progress) return;
    const update = () => {
      const doc = document.documentElement;
      const distance = doc.scrollHeight - doc.clientHeight;
      const percent = distance > 0 ? (doc.scrollTop / distance) * 100 : 0;
      progress.style.width = `${Math.min(100, Math.max(0, percent))}%`;
    };
    update();
    document.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
  })();
</script>
